<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="100%" height="100%">
    <!-- Green hills background -->
    <rect width="800" height="400" fill="#a8e6cf" />
    <path d="M 0 400 Q 200 250 400 400 Q 600 250 800 400 L 800 400 L 0 400 Z" fill="#388e3c" />
    <path d="M 0 400 Q 400 150 800 400 L 800 400 L 0 400 Z" fill="#2e7d32" opacity="0.6"/>
    <!-- Rain -->
    <text x="100" y="100" font-size="50">🌧️</text>
    <text x="300" y="80" font-size="60">🌧️</text>
    <text x="500" y="120" font-size="50">🌧️</text>
    <text x="700" y="70" font-size="50">🌧️</text>
    
    <!-- Train -->
    <text x="400" y="240" font-family="sans-serif" font-size="120" text-anchor="middle" dominant-baseline="middle">🚄</text>
    <text x="400" y="350" font-family="sans-serif" font-size="36" fill="white" text-anchor="middle" font-weight="bold" stroke="black" stroke-width="1">Entering the Rainy Valley!</text>
</svg>
