<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="100%" height="100%">
    <!-- Stormy background -->
    <rect width="800" height="400" fill="#4a69bd" />
    
    <!-- Giant water puddle -->
    <path d="M 0 350 Q 200 280 400 350 T 800 350 L 800 400 L 0 400 Z" fill="#0abde3" />
    <path d="M 0 380 Q 200 310 400 380 T 800 380 L 800 400 L 0 400 Z" fill="#48dbfb" />

    <!-- Train crashing through water -->
    <text x="400" y="250" font-family="sans-serif" font-size="120" text-anchor="middle" dominant-baseline="middle">🚄</text>
    <text x="300" y="280" font-family="sans-serif" font-size="80" text-anchor="middle" dominant-baseline="middle">💦</text>
    <text x="500" y="280" font-family="sans-serif" font-size="80" text-anchor="middle" dominant-baseline="middle">🌊</text>
    <text x="400" y="280" font-family="sans-serif" font-size="100" text-anchor="middle" dominant-baseline="middle">💥</text>
    
    <text x="400" y="350" font-family="sans-serif" font-size="36" fill="white" text-anchor="middle" font-weight="bold" stroke="black" stroke-width="1">SPLASH! Powering through!</text>
</svg>
