<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="100%" height="100%">
    <!-- City/River background -->
    <rect width="800" height="400" fill="#ff9ff3" />
    <rect width="800" height="150" y="250" fill="#54a0ff" />
    
    <!-- Monorail Track -->
    <rect width="800" height="20" y="180" fill="#576574" />
    <rect width="20" height="100" x="200" y="200" fill="#222f3e" />
    <rect width="20" height="100" x="600" y="200" fill="#222f3e" />
    
    <!-- Train skidding sideways -->
    <g transform="translate(400, 160) rotate(-15)">
        <text x="0" y="0" font-family="sans-serif" font-size="100" text-anchor="middle" dominant-baseline="middle">🚄</text>
        <text x="80" y="30" font-family="sans-serif" font-size="50" text-anchor="middle" dominant-baseline="middle">⚡</text>
        <text x="-80" y="30" font-family="sans-serif" font-size="50" text-anchor="middle" dominant-baseline="middle">💨</text>
    </g>
    
    <text x="400" y="350" font-family="sans-serif" font-size="36" fill="white" text-anchor="middle" font-weight="bold" stroke="black" stroke-width="1">Skidding on the Monorail!</text>
</svg>
